; PlatformIO Project Configuration
; ESP32-WROOM-32U is supported by the generic ESP32 Dev Module profile.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	adafruit/Adafruit ADS1X15
	arduino-libraries/Ethernet
	https://github.com/patricklaf/SNMP.git
	links2004/WebSockets
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
	-DCORE_DEBUG_LEVEL=1
	; Uncomment to override W5500 CS pin during hardware bring-up, e.g. GPIO32.
	; -DW5500_CS_PIN=32
	; Uncomment if W5500 RST is wired to ESP32 GPIO, e.g. GPIO4.
	; -DW5500_RST_PIN=4
